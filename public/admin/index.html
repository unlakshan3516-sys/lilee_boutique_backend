<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lilee boutique — admin</title>
<style>
  :root{ --ink:#2b1a10; --bone:#ffffff; --bone-soft:#f5f1ec; --stone:#8c7a6b; --stone-line:#e2d9cd; }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,Segoe UI,Inter,sans-serif; background:var(--bone-soft); color:var(--ink); margin:0; padding:0; }
  header{ background:var(--ink); color:var(--bone); padding:20px 30px; }
  header h1{ margin:0; font-size:18px; font-weight:600; }
  .wrap{ max-width:1000px; margin:0 auto; padding:30px; }
  .tabs{ display:flex; gap:10px; margin-bottom:24px; }
  .tab-btn{ padding:10px 18px; border:1px solid var(--stone-line); background:var(--bone); cursor:pointer; font-size:13px; border-radius:4px; }
  .tab-btn.active{ background:var(--ink); color:var(--bone); }
  .panel{ display:none; }
  .panel.active{ display:block; }
  table{ width:100%; border-collapse:collapse; background:var(--bone); }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--stone-line); font-size:13px; }
  th{ background:var(--bone-soft); }
  button{ cursor:pointer; }
  .btn{ background:var(--ink); color:var(--bone); border:none; padding:8px 16px; border-radius:4px; font-size:13px; }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn-danger{ background:#7a2e2e; }
  .form-card{ background:var(--bone); border:1px solid var(--stone-line); padding:24px; border-radius:6px; margin-bottom:24px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .form-row.full{ grid-template-columns:1fr; }
  label{ display:block; font-size:12px; color:var(--stone); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em; }
  input, textarea{ width:100%; padding:9px 10px; border:1px solid var(--stone-line); border-radius:4px; font-size:13px; font-family:inherit; }
  textarea{ min-height:60px; resize:vertical; }
  .login-box{ max-width:340px; margin:100px auto; background:var(--bone); padding:30px; border-radius:6px; border:1px solid var(--stone-line); }
  .status{ font-size:12px; padding:3px 8px; border-radius:3px; background:var(--bone-soft); }
  .msg{ font-size:13px; padding:10px; border-radius:4px; margin-bottom:14px; }
  .msg.error{ background:#fbeaea; color:#7a2e2e; }
  .msg.success{ background:#e9f5e9; color:#2e5c2e; }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2 style="margin-top:0;">Admin Login</h2>
  <div id="loginMsg"></div>
  <label>Username</label>
  <input id="loginUser" type="text" style="margin-bottom:12px;">
  <label>Password</label>
  <input id="loginPass" type="password" style="margin-bottom:18px;">
  <button class="btn" id="loginBtn" style="width:100%;">Log In</button>
</div>

<div id="adminScreen" style="display:none;">
  <header><h1>lilee boutique — admin</h1></header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="orders">Orders</button>
    </div>

    <div id="productsPanel" class="panel active">
      <div class="form-card">
        <h3 id="formTitle" style="margin-top:0;">Add a Product</h3>
        <div id="productMsg"></div>
        <input type="hidden" id="p_editing_id">
        <div class="form-row">
          <div><label>Product ID (lowercase-dashes, e.g. linen-shirt)</label><input id="p_id"></div>
          <div><label>Name</label><input id="p_name"></div>
        </div>
        <div class="form-row">
          <div><label>Price (USD)</label><input id="p_price" type="number" step="0.01"></div>
          <div><label>Tag (New / Restock / blank)</label><input id="p_tag"></div>
        </div>
        <div class="form-row">
          <div><label>Fabric</label><input id="p_fabric" placeholder="100% Linen"></div>
          <div><label>Sizes, comma separated</label><input id="p_sizes" placeholder="S,M,L,XL"></div>
        </div>
        <div class="form-row full"><div><label>Description</label><textarea id="p_description"></textarea></div></div>
        <div class="form-row">
          <div><label>Composition</label><input id="p_composition"></div>
          <div><label>Origin</label><input id="p_origin"></div>
        </div>
        <div class="form-row">
          <div><label>Care</label><input id="p_care"></div>
          <div><label>Fit</label><input id="p_fit"></div>
        </div>
        <button class="btn" id="saveProductBtn">Save Product</button>
        <button class="btn" id="cancelEditBtn" style="background:var(--stone); display:none; margin-left:8px;">Cancel Edit</button>
      </div>

      <table id="productsTable">
        <thead><tr><th>Name</th><th>Price</th><th>Fabric</th><th>Sizes</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="ordersPanel" class="panel">
      <table id="ordersTable">
        <thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let authHeader = sessionStorage.getItem("lilee_admin_auth") || "";

  function api(path, opts = {}) {
    return fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", "Authorization": authHeader, ...(opts.headers || {}) }
    });
  }

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    authHeader = "Basic " + btoa(`${user}:${pass}`);
    const res = await api("/api/orders");
    if (res.ok) {
      sessionStorage.setItem("lilee_admin_auth", authHeader);
      showAdmin();
    } else {
      document.getElementById("loginMsg").innerHTML = `<div class="msg error">Invalid username or password.</div>`;
    }
  });

  function showAdmin() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminScreen").style.display = "block";
    loadProducts();
    loadOrders();
  }

  if (authHeader) {
    api("/api/orders").then(res => { if (res.ok) showAdmin(); });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab + "Panel").classList.add("active");
    });
  });

  async function loadProducts() {
    const res = await fetch("/api/products");
    const products = await res.json();
    const tbody = document.querySelector("#productsTable tbody");
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>$${p.price}</td>
        <td>${p.fabric}</td>
        <td>${p.sizes.map(s => s.in_stock ? s.size : `<s>${s.size}</s>`).join(", ")}</td>
        <td>
          <button class="btn btn-sm" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </td>
      </tr>
    `).join("");
  }

  function editProduct(p) {
    document.getElementById("formTitle").textContent = "Edit Product";
    document.getElementById("p_editing_id").value = p.id;
    document.getElementById("p_id").value = p.id;
    document.getElementById("p_id").disabled = true;
    document.getElementById("p_name").value = p.name;
    document.getElementById("p_price").value = p.price;
    document.getElementById("p_tag").value = p.tag || "";
    document.getElementById("p_fabric").value = p.fabric;
    document.getElementById("p_sizes").value = p.sizes.map(s => s.size).join(",");
    document.getElementById("p_description").value = p.description;
    document.getElementById("p_composition").value = p.composition;
    document.getElementById("p_origin").value = p.origin;
    document.getElementById("p_care").value = p.care;
    document.getElementById("p_fit").value = p.fit;
    document.getElementById("cancelEditBtn").style.display = "inline-block";
    window.scrollTo(0, 0);
  }

  document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

  function resetForm() {
    ["p_editing_id","p_id","p_name","p_price","p_tag","p_fabric","p_sizes","p_description","p_composition","p_origin","p_care","p_fit"]
      .forEach(id => document.getElementById(id).value = "");
    document.getElementById("p_id").disabled = false;
    document.getElementById("formTitle").textContent = "Add a Product";
    document.getElementById("cancelEditBtn").style.display = "none";
  }

  document.getElementById("saveProductBtn").addEventListener("click", async () => {
    const editingId = document.getElementById("p_editing_id").value;
    const sizes = document.getElementById("p_sizes").value.split(",").map(s => s.trim()).filter(Boolean).map(s => ({ size: s, in_stock: 1 }));

    const payload = {
      id: document.getElementById("p_id").value.trim(),
      name: document.getElementById("p_name").value.trim(),
      price: parseFloat(document.getElementById("p_price").value),
      tag: document.getElementById("p_tag").value.trim(),
      fabric: document.getElementById("p_fabric").value.trim(),
      description: document.getElementById("p_description").value.trim(),
      composition: document.getElementById("p_composition").value.trim(),
      origin: document.getElementById("p_origin").value.trim(),
      care: document.getElementById("p_care").value.trim(),
      fit: document.getElementById("p_fit").value.trim(),
      art: `<circle cx="60" cy="75" r="40" fill="none" stroke="#2b1a10" stroke-width="1.3"/>`, // default placeholder art
      sizes
    };

    const msgEl = document.getElementById("productMsg");
    const res = editingId
      ? await api(`/api/products/${editingId}`, { method: "PUT", body: JSON.stringify(payload) })
      : await api("/api/products", { method: "POST", body: JSON.stringify(payload) });

    if (res.ok) {
      msgEl.innerHTML = `<div class="msg success">Saved.</div>`;
      resetForm();
      loadProducts();
    } else {
      const err = await res.json();
      msgEl.innerHTML = `<div class="msg error">${err.error || "Something went wrong."}</div>`;
    }
  });

  async function deleteProduct(id) {
    if (!confirm("Remove this product from the shop?")) return;
    await api(`/api/products/${id}`, { method: "DELETE" });
    loadProducts();
  }

  async function loadOrders() {
    const res = await api("/api/orders");
    const orders = await res.json();
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = orders.map(o => `
      <tr>
        <td>#${o.id}</td>
        <td>${o.customer_name}<br><span style="color:var(--stone); font-size:11px;">${o.customer_email}</span></td>
        <td>${o.items.map(i => `${i.qty}× ${i.product_name} (${i.size})`).join("<br>")}</td>
        <td>$${o.total.toFixed(2)}</td>
        <td><span class="status">${o.status}</span></td>
        <td>
          <select onchange="updateOrderStatus(${o.id}, this.value)">
            <option ${o.status==='pending'?'selected':''}>pending</option>
            <option ${o.status==='confirmed'?'selected':''}>confirmed</option>
            <option ${o.status==='shipped'?'selected':''}>shipped</option>
            <option ${o.status==='delivered'?'selected':''}>delivered</option>
          </select>
        </td>
      </tr>
    `).join("") || `<tr><td colspan="6" style="text-align:center; color:var(--stone);">No orders yet.</td></tr>`;
  }

  async function updateOrderStatus(id, status) {
    await api(`/api/orders/${id}`, { method: "PUT", body: JSON.stringify({ status }) });
    loadOrders();
  }
</script>

</body>
</html>
